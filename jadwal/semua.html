<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadwal PKKM · KKMA 04 Jember</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>Jadwal PKKM</h1><p>KKMA 04 Jember · Penilaian Kinerja Kepala Madrasah Tahun 2026</p></header><div class="stats" id="stats"></div><div class="tools"><input id="q" placeholder="Cari nama madrasah atau kepala madrasah"><select id="filter"><option value="">Semua status</option><option value="yes">Sudah dijadwalkan</option><option value="no">Belum dijadwalkan</option></select><button id="export" class="btn light">Unduh CSV</button></div><section id="cards" class="grid">Memuat jadwal…</section><p class="notice">Halaman informasi publik · Data jadwal dapat berubah sewaktu-waktu.</p></main><script src="config.js"></script><script>
const $=id=>document.getElementById(id),url=window.PKKM_SUPABASE_URL,key=window.PKKM_SUPABASE_KEY;let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(d){return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Belum ditentukan'}async function load(){try{const r=await fetch(url+'/rest/v1/rpc/pkkm_public_schedules',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error(await r.text());rows=await r.json();render()}catch(e){$('cards').innerHTML='<p class="error">Jadwal belum dapat dimuat. Silakan coba beberapa saat lagi.</p>';console.error(e)}}function render(){let n=rows.filter(x=>x['Tanggal PKKM']).length;$('stats').innerHTML=`<div class="stat"><b>${rows.length}</b>Total madrasah</div><div class="stat"><b>${n}</b>Terjadwal</div><div class="stat"><b>${rows.length-n}</b>Belum dijadwalkan</div>`;let q=$('q').value.toLowerCase(),f=$('filter').value,a=rows.filter(x=>(x['Nama Madrasah']+' '+x['Nama Kepala Madrasah']).toLowerCase().includes(q)&&(!f||(f==='yes'?!!x['Tanggal PKKM']:!x['Tanggal PKKM']))),groups=a.reduce((m,x)=>((m[x['Tanggal PKKM']||'']??=[]).push(x),m),{});$('cards').innerHTML=Object.entries(groups).map(([day,items])=>`<article class="schedule day-card"><div class="row day-heading"><div class="date">${day?date(day):'Belum ditentukan'}</div><span class="badge">${items.length} madrasah</span></div>${items.map(x=>`<section class="school-entry"><div class="row"><span class="minor">#${esc(x['NO.'])}</span><span class="minor">${esc(x.Jam||'Jam belum ditentukan')}</span></div><div class="school">${esc(x['Nama Madrasah'])}</div><div class="principal">Kepala madrasah: ${esc(x['Nama Kepala Madrasah'])}</div>${x.Lokasi?`<div class="minor">Lokasi: ${esc(x.Lokasi)}</div>`:''}${x.Catatan?`<div class="minor">${esc(x.Catatan)}</div>`:''}</section>`).join('')}</article>`).join('')}$('q').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{let h=['NO.','Nama Madrasah','Nama Kepala Madrasah','Tanggal PKKM','Jam','Lokasi','Catatan'],csv=[h,...rows.map(r=>h.map(k=>r[k]||''))].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='jadwal-pkkm-kkma-04-jember.csv';a.click();URL.revokeObjectURL(a.href)};load();
</script></body></html>
