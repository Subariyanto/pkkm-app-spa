<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Jadwal PKKM · KKMA 04 Jember</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>Jadwal PKKM</h1><p>KKMA 04 Jember · Panel tim penilai</p></header><div class="stats" id="stats"></div><div class="tools"><input id="q" placeholder="Cari madrasah / kepala madrasah"><select id="filter"><option value="">Semua jadwal</option><option value="yes">Terjadwal</option><option value="no">Belum dijadwalkan</option></select><button id="export" class="btn light">Unduh CSV</button></div><section id="cards" class="grid">Memuat…</section><p class="notice">Setiap kartu memuat lembaga pada tanggal yang sama. Nama, tanggal, dan jam bisa diubah melalui tombol Edit.</p></main><div id="modal" class="shade"><section class="modal"><h2>Edit jadwal madrasah</h2><label>Nama madrasah<input id="name" type="text"></label><label>Tanggal<input id="date" type="date"></label><label>Jam<input id="time" type="time"></label><label>Lokasi<textarea id="location"></textarea></label><label>Catatan<textarea id="notes"></textarea></label><div class="actions"><button id="cancel" class="btn light">Batal</button><button id="save" class="btn">Simpan perubahan</button></div></section></div><script src="config.js"></script><script src="app.js"></script></body></html>
